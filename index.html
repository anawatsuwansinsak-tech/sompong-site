
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รัศมี SPAM</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: black;
  height: 100vh;
  overflow: hidden;
  font-family: sans-serif;
}

.spam {
  position: absolute;
  font-weight: 900;
  white-space: nowrap;
  animation:
    rainbow 0.4s infinite,
    shake 0.15s infinite alternate;
  text-shadow: 0 0 15px currentColor;
  user-select: none;
}

@keyframes rainbow {
  0% { color: red; }
  20% { color: yellow; }
  40% { color: lime; }
  60% { color: cyan; }
  80% { color: magenta; }
  100% { color: red; }
}

@keyframes shake {
  0% { transform: translate(5px, -5px) rotate(-5deg); }
  100% { transform: translate(-5px, 5px) rotate(5deg); }
}

</style>
</head>

<body>

<script>
const word = "รัศมี";
const total = 250;

for (let i = 0; i < total; i++) {
  const text = document.createElement("div");

  text.className = "spam";
  text.innerText = word;

  text.style.left = Math.random() * 100 + "vw";
  text.style.top = Math.random() * 100 + "vh";
  text.style.fontSize = (20 + Math.random() * 100) + "px";
  text.style.animationDelay = Math.random() + "s";

  document.body.appendChild(text);
}
</script>

<audio autoplay loop>
  <source src="https://www.soundjay.com/button/beep-07.wav"
  type="audio/wav">
</audio>

</body>
</html>
